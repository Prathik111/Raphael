[project]
name = "ai-ecosystem"
version = "0.1.0"
description = "AI Ecosystem - personal AI operating layer"
readme = "docs/VISION.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "ruff==0.6.9",
    "mypy>=1.11",
]

[project.scripts]
ai-ecosystem-serve = "ai_ecosystem.interface.serve:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["build", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# These callbacks intentionally isolate arbitrary subscriber/callback failures.
"src/ai_ecosystem/core/events/bus.py" = ["SIM105"]
"src/ai_ecosystem/core/logging/logger.py" = ["SIM105"]
"src/ai_ecosystem/core/persistence/sqlite.py" = ["SIM105"]
"src/ai_ecosystem/interface/api.py" = ["SIM105"]
"src/ai_ecosystem/scheduler/scheduler.py" = ["SIM105"]
# These benchmark/test constructs intentionally capture loop values or inspect source text.
"src/ai_ecosystem/bench/benchmarks.py" = ["B023"]
"tests/**/*.py" = ["B017", "SIM105", "SIM115", "B023"]
# Packaging tests deliberately import after isolated bootstrap setup.
"tests/unit/test_packaging.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
