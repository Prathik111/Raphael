<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raphael HUD Prototype</title>
<style>
  :root { color-scheme: dark; --fg:#f4f7f7; --muted:rgba(226,236,244,.62); --line:rgba(255,255,255,.28); --panel:rgba(0,0,0,.72); }
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#030b08; color:var(--fg); font-family:Consolas,"Cascadia Mono",ui-monospace,monospace; }
  body { position:relative; transition:filter 380ms ease,transform 380ms ease; }
  body.startup-intro { filter:blur(28px) brightness(.12); transform:scale(1.08); }
  #canvas-wrap, #fallback-visual { position:fixed; inset:0; width:100%; height:100%; }
  #canvas-wrap { z-index:0; }
  #canvas-wrap canvas { display:block; width:100%; height:100%; }
  #fallback-visual { z-index:1; pointer-events:none; opacity:1; transition:opacity 400ms ease; background:radial-gradient(circle at 50% 33%,rgba(19,100,73,.20),transparent 30%),linear-gradient(180deg,#020807 0%,#030b08 52%,#010504 100%); }
  body.three-ready #fallback-visual { opacity:0; }
  #fallback-core { position:absolute; left:50%; top:34%; width:min(52vw,580px); aspect-ratio:1; transform:translate(-50%,-50%); filter:drop-shadow(0 0 20px rgba(95,255,194,.22)); }
  #fallback-core .orbit { fill:none; stroke:rgba(205,255,238,.42); stroke-width:1.2; }
  #fallback-core .orbit2 { transform-origin:center; animation:orbit 13s linear infinite; }
  #fallback-core .core { fill:none; stroke:rgba(255,255,255,.82); stroke-width:1.5; }
  #fallback-core .core2 { fill:none; stroke:rgba(171,255,222,.26); stroke-width:1; }
  #fallback-core .glow { fill:rgba(227,255,244,.06); stroke:rgba(242,255,249,.7); stroke-width:1; }
  #fallback-core .dot { fill:#fff; }
  @keyframes orbit { to { transform:rotate(360deg); } }
  #brand { position:fixed; z-index:12; top:20px; left:24px; display:flex; align-items:center; gap:10px; pointer-events:none; }
  #brand-mark { width:30px; height:30px; border:1px solid rgba(255,255,255,.7); display:flex; align-items:center; justify-content:center; font-size:15px; }
  #brand-text { letter-spacing:.30em; font-size:12px; font-weight:600; }
  #brand-sub { display:block; margin-top:4px; letter-spacing:.24em; font-size:8px; opacity:.5; }
  #status { position:fixed; z-index:12; left:24px; bottom:18px; font-size:9px; letter-spacing:.10em; color:rgba(255,255,255,.42); pointer-events:none; }
  #quick-dock { position:fixed; z-index:12; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:6px; padding:7px 8px; border:1px solid rgba(255,255,255,.16); background:rgba(0,0,0,.30); backdrop-filter:blur(3px); }
  .quick-btn { border:1px solid rgba(255,255,255,.22); background:rgba(0,0,0,.65); color:rgba(236,245,246,.78); padding:5px 10px; font-size:9px; letter-spacing:.12em; cursor:pointer; }
  .quick-btn:hover { color:#fff; border-color:rgba(255,255,255,.65); }
  #quick-perf { font-size:8px; opacity:.45; padding-left:5px; white-space:nowrap; }
  #core-hit { position:fixed; left:50%; top:34%; width:min(30vw,360px); height:min(30vw,360px); transform:translate(-50%,-50%); z-index:6; border:0; background:transparent; cursor:pointer; }
  #radial-menu { position:fixed; z-index:14; left:50%; top:34%; width:min(34vw,430px); height:min(34vw,430px); transform:translate(-50%,-50%); pointer-events:none; opacity:0; transition:opacity 180ms ease; }
  #radial-menu.open { opacity:1; pointer-events:auto; }
  .radial-item { position:absolute; width:82px; height:30px; background:#000; color:#fff; border:1px solid rgba(255,255,255,.42); font:9px Consolas,monospace; letter-spacing:.13em; cursor:pointer; transform:translate(-50%,-50%); }
  .radial-item:hover { border-color:#fff; background:#0d1411; }
  .radial-item:nth-child(1){left:50%;top:4%;}.radial-item:nth-child(2){left:96%;top:50%;}.radial-item:nth-child(3){left:50%;top:96%;}.radial-item:nth-child(4){left:4%;top:50%;}
  #center-panel-overlay { position:fixed; inset:0; z-index:20; display:flex; align-items:center; justify-content:center; opacity:0; pointer-events:none; transition:opacity:240ms ease; background:rgba(0,0,0,.12); }
  #center-panel-overlay.open { opacity:1; pointer-events:auto; }
  #center-panel-frame { position:relative; width:100vw; height:68vh; border-top:1px solid rgba(255,255,255,.5); border-bottom:1px solid rgba(255,255,255,.5); background:rgba(0,0,0,.78); box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 50px rgba(0,0,0,.35); animation:none; }
  #center-panel { height:100%; overflow:auto; padding:38px 26px 24px; box-sizing:border-box; font-size:12px; line-height:1.6; }
  #center-panel-close { position:absolute; right:10px; top:8px; z-index:3; border:1px solid rgba(255,255,255,.28); background:#000; color:#fff; width:28px; height:24px; cursor:pointer; }
  #center-panel h2,#center-panel h3,#center-panel h4 { margin:0 0 8px; letter-spacing:.16em; font-weight:400; }
  #chat-layout { display:flex; gap:18px; max-width:1180px; margin:0 auto; min-height:100%; }
  #chat-sidebar { flex:0 0 190px; border-right:1px solid rgba(255,255,255,.12); padding-right:14px; }
  #chat-sidebar button,#chat-send,#think-toggle { width:100%; background:#000; color:#fff; border:1px solid rgba(255,255,255,.24); padding:6px 8px; cursor:pointer; font-size:10px; letter-spacing:.1em; }
  #chat-sidebar button:hover,#chat-send:hover,#think-toggle:hover { border-color:rgba(255,255,255,.7); }
  #topic-list { margin-top:12px; }
  .topic-item { padding:6px 4px; opacity:.7; cursor:pointer; border-left:2px solid transparent; font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topic-item.active,.topic-item:hover { opacity:1; border-left-color:#fff; background:rgba(255,255,255,.05); }
  #panel-section-chat { flex:1; display:flex; flex-direction:column; min-width:0; }
  #chat-identity-name { font-size:10px; opacity:.62; letter-spacing:.16em; margin-bottom:8px; }
  #history-list { flex:1; overflow:auto; padding-right:8px; }
  .history-entry { max-width:78%; padding:7px 10px; margin:0 0 12px; border-left:2px solid rgba(255,255,255,.24); }
  .history-entry.user { margin-left:auto; text-align:right; border-left:0; border-right:2px solid rgba(255,255,255,.42); background:rgba(255,255,255,.035); }
  .history-entry .role-label { display:block; font-size:9px; opacity:.55; letter-spacing:.1em; margin-bottom:2px; }
  #chat-bar { margin-top:10px; padding:7px 9px; border:1px solid rgba(255,255,255,.28); background:rgba(0,0,0,.62); }
  #chat-input-row { display:flex; align-items:center; gap:8px; }
  #chat-input { flex:1; min-width:0; border:0; outline:none; background:none; color:#fff; padding:4px 2px; }
  #chat-send,#think-toggle { width:auto; }
  #ws-status { font-size:9px; opacity:.45; padding-left:8px; }
  #caption-box { position:fixed; z-index:15; left:50%; top:13%; transform:translateX(-50%); width:min(70%,640px); padding:16px 26px; border:2px solid #fff; color:#fff; font-size:16px; line-height:1.5; text-align:center; background:#000; opacity:0; pointer-events:none; }
  #caption-box.show { opacity:1; }
  #caption-text { white-space:pre-wrap; }
  #error-toast { position:fixed; z-index:30; right:16px; top:16px; max-width:420px; padding:8px 11px; border:1px solid rgba(255,255,255,.3); background:rgba(0,0,0,.85); color:#fff; font-size:9px; line-height:1.5; opacity:0; pointer-events:none; }
  #error-toast.show { opacity:1; }
  @media (max-width:900px){#quick-dock{gap:3px}.quick-btn{padding:4px 6px;font-size:8px}#chat-layout{gap:10px}#chat-sidebar{flex-basis:140px}}
</style>
</head>
<body class="startup-intro">
<div id="canvas-wrap"></div>
<div id="fallback-visual"><svg id="fallback-core" viewBox="0 0 100 100" aria-hidden="true"><g transform="translate(50 50)"><ellipse class="orbit" rx="38" ry="25" transform="rotate(18)"/><ellipse class="orbit orbit2" rx="30" ry="22" transform="rotate(73)"/><polygon class="core" points="0,-27 25,-8 16,21 -16,21 -25,-8"/><polygon class="core2" points="0,-35 31,-11 19,28 -19,28 -31,-11"/><circle class="glow" r="9"/><circle class="dot" cx="0" cy="-27" r=".9"/><circle class="dot" cx="25" cy="-8" r=".9"/><circle class="dot" cx="16" cy="21" r=".9"/><circle class="dot" cx="-16" cy="21" r=".9"/><circle class="dot" cx="-25" cy="-8" r=".9"/></g></svg></div>
<div id="brand"><div id="brand-mark">R</div><div><div id="brand-text">RAPHAEL</div><span id="brand-sub">AI OPERATING LAYER</span></div></div>
<div id="status">AI: waiting for backend</div>
<button id="core-hit" aria-label="Open Raphael menu"></button>
<div id="radial-menu"><button class="radial-item" data-action="chat">CHAT</button><button class="radial-item" data-action="history">HISTORY</button><button class="radial-item" data-action="memory">MEMORY</button><button class="radial-item" data-action="settings">SETTINGS</button></div>
<div id="quick-dock"><button class="quick-btn" id="quick-pause">PAUSE</button><button class="quick-btn" id="quick-motion">MOTION</button><button class="quick-btn" id="quick-center">CENTER</button><span id="quick-perf">60 FPS</span></div>
<div id="caption-box"><div id="caption-text"></div></div>
<div id="error-toast"></div>
<div id="center-panel-overlay">
  <div id="center-panel-frame">
    <button id="center-panel-close" aria-label="Close">✕</button>
    <div id="center-panel">
      <div id="panel-section-chat">
        <div id="chat-identity-name">RAPHAEL // AI OPERATING LAYER</div>
        <div id="chat-layout">
          <aside id="chat-sidebar"><button id="new-chat-btn">+ New chat</button><div id="topic-list"></div></aside>
          <section style="flex:1;min-width:0;display:flex;flex-direction:column"><div id="history-list"></div><div id="chat-bar"><div id="chat-input-row"><input id="chat-input" placeholder="Ask Raphael..." autocomplete="off"><button id="think-toggle" type="button" aria-pressed="false">THINK</button><button id="chat-send">SEND</button><span id="ws-status">AI: waiting for backend</span></div></div></section>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const wrap = $('canvas-wrap');
  const status = $('status');
  const wsStatus = $('ws-status');
  const panel = $('center-panel-overlay');
  const history = $('history-list');
  const topics = $('topic-list');
  const caption = $('caption-box');
  const captionText = $('caption-text');
  const toast = $('error-toast');
  const radial = $('radial-menu');
  const input = $('chat-input');
  const send = $('chat-send');
  const think = $('think-toggle');
  let backend = { base:'http://127.0.0.1:8765', token:null };
  let thinking = false, thinkHarder = false, paused = false, panelMode = 'chat';
  const chats = [{id:Date.now(),title:'New chat',messages:[]}];
  let active = chats[0];

  function postReady(){ try { parent.postMessage({source:'raphael-stage',type:'ready'}, '*'); } catch {} }
  window.addEventListener('message',(e)=>{
    const m=e.data; if(!m || m.source!=='raphael-react') return;
    if(m.type==='backend'){
      backend={base:String(m.base||backend.base),token:m.token?String(m.token):null};
      const ready=!!backend.token; status.textContent=ready?'AI: ready':'AI: waiting for backend'; wsStatus.textContent=ready?'AI: ready':'AI: waiting for backend';
    }
    if(m.type==='new-chat') newChat();
  });

  async function request(path, init={}){
    const headers=Object.assign({'Content-Type':'application/json'},init.headers||{});
    if(backend.token) headers.Authorization='Bearer '+backend.token;
    const res=await fetch(backend.base+path,Object.assign({},init,{headers}));
    if(!res.ok) throw new Error(res.status+': '+await res.text());
    return res.json();
  }

  function renderTopics(){
    topics.innerHTML='';
    chats.forEach((c)=>{const b=document.createElement('div');b.className='topic-item'+(c===active?' active':'');b.textContent=c.title;b.onclick=()=>{active=c;renderHistory();renderTopics()};topics.appendChild(b)})
  }
  function renderHistory(){
    history.innerHTML='';
    active.messages.forEach((m)=>{const el=document.createElement('div');el.className='history-entry'+(m.role==='user'?' user':'');el.innerHTML='<span class="role-label">'+(m.role==='user'?'YOU':'RAPHAEL')+'</span>'+escapeHtml(m.text);history.appendChild(el)});
    history.scrollTop=history.scrollHeight;
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function newChat(){active={id:Date.now(),title:'New chat',messages:[]};chats.push(active);renderTopics();renderHistory();panel.classList.add('open');}
  function openPanel(mode='chat'){panelMode=mode;panel.classList.add('open');radial.classList.remove('open');renderTopics();renderHistory();}
  function closePanel(){panel.classList.remove('open')}
  function showCaption(text){captionText.textContent=text;caption.classList.add('show');clearTimeout(showCaption.t);showCaption.t=setTimeout(()=>caption.classList.remove('show'),7500)}
  function showError(text){toast.textContent=text;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),6000)}

  async function sendChat(){
    const text=input.value.trim(); if(!text) return;
    if(!backend.token){showError('Backend credential unavailable.');return;}
    active.messages.push({role:'user',text}); if(active.title==='New chat') active.title=text.slice(0,40); input.value=''; renderTopics();renderHistory(); thinking=true; think.classList.toggle('busy',true);
    try{
      const created=await request('/tasks',{method:'POST',body:JSON.stringify({goal:text})});
      let current=created;
      for(let i=0;i<180;i++){await new Promise(r=>setTimeout(r,500));current=await request('/tasks/'+created.task_id);if(current.completed||current.state==='FAILED'||current.state==='CANCELLED')break;}
      const result=await request('/tasks/'+created.task_id+'/result');
      const reply=result.reply||result.summary||result.error||'Task completed without a response.';
      active.messages.push({role:'assistant',text:reply}); renderHistory(); renderTopics(); showCaption(reply);
      status.textContent=result.status==='COMPLETED'?'AI: ready':'AI: '+String(result.status||current.state||'done').toLowerCase(); wsStatus.textContent=status.textContent;
    }catch(err){status.textContent='AI: error';wsStatus.textContent='AI: error';showError(err&&err.message?err.message:String(err))}
    finally{thinking=false;think.classList.remove('busy')}
  }

  send.onclick=sendChat; input.addEventListener('keydown',(e)=>{if(e.key==='Enter')sendChat()}); $('new-chat-btn').onclick=newChat; $('center-panel-close').onclick=closePanel; $('quick-center').onclick=()=>{worldGroup.position.x=0;worldGroup.position.y=1;};
  think.onclick=()=>{thinkHarder=!thinkHarder;think.setAttribute('aria-pressed',String(thinkHarder))};
  $('quick-pause').onclick=()=>{paused=!paused;$('quick-pause').textContent=paused?'PLAY':'PAUSE'};
  $('quick-motion').onclick=()=>{document.body.classList.toggle('reduced-motion')};
  $('core-hit').onclick=()=>radial.classList.toggle('open');
  document.addEventListener('keydown',(e)=>{if(e.key==='Escape'){radial.classList.remove('open');closePanel()}if(e.key.toLowerCase()==='p')paused=!paused});
  radial.querySelectorAll('.radial-item').forEach((b)=>b.onclick=()=>{const a=b.dataset.action;if(a==='chat'||a==='history')openPanel('chat');else if(a==='memory'){showCaption('Memory workspace is attached to Raphael\'s runtime.');openPanel('chat')}else openPanel('chat')});

  let worldGroup={position:{x:0,y:1}};
  try {
    if(typeof THREE==='undefined') throw new Error('THREE unavailable');
    const scene=new THREE.Scene(); worldGroup=new THREE.Group(); worldGroup.position.y=1; worldGroup.scale.setScalar(.78); scene.add(worldGroup);
    const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,.1,100);camera.position.set(0,0,10);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.25));renderer.setSize(innerWidth,innerHeight);renderer.autoClear=false;wrap.appendChild(renderer.domElement);
    function loop(r,o,z=0){const pts=[];for(let i=0;i<=160;i++){const a=i/160*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r*.72,0))}const g=new THREE.BufferGeometry().setFromPoints(pts);const m=new THREE.LineBasicMaterial({color:0xdfffee,transparent:true,opacity:o,blending:THREE.AdditiveBlending,depthWrite:false});const l=new THREE.Line(g,m);l.rotation.x=.34;l.rotation.z=z;return l}
    const rings=new THREE.Group();worldGroup.add(rings);for(let i=0;i<9;i++)rings.add(loop(2.45+i*.30,.15-i*.011,i*.19));
    const core=new THREE.Group();worldGroup.add(core);const ico=new THREE.IcosahedronGeometry(2.85,1);core.add(new THREE.LineSegments(new THREE.EdgesGeometry(ico),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.68,blending:THREE.AdditiveBlending})));const outer=new THREE.IcosahedronGeometry(3.25,0);core.add(new THREE.LineSegments(new THREE.EdgesGeometry(outer),new THREE.LineBasicMaterial({color:0xbfffe9,transparent:true,opacity:.22,blending:THREE.AdditiveBlending})));const verts=outer.attributes.position,dots=new THREE.Group(),seen=new Set();for(let i=0;i<verts.count;i++){const x=verts.getX(i),y=verts.getY(i),z=verts.getZ(i),k=x.toFixed(2)+','+y.toFixed(2)+','+z.toFixed(2);if(seen.has(k))continue;seen.add(k);const d=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));d.position.set(x,y,z);dots.add(d)}core.add(dots);
    const orb=new THREE.Mesh(new THREE.SphereGeometry(.68,36,36),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0}},vertexShader:'varying vec3 vN;void main(){vN=normalize(normalMatrix*normal);gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform float uTime;varying vec3 vN;void main(){float rim=pow(1.-max(dot(normalize(vN),vec3(0.,0.,1.)),0.),2.5);float pulse=.9+.1*sin(uTime*2.);float a=.06+.94*rim;vec3 c=vec3(.82,1.,.91)*(.38+1.7*rim)*pulse;gl_FragColor=vec4(c*a,a);}'}));core.add(orb);
    const filaments=new THREE.Group();worldGroup.add(filaments);for(let i=0;i<34;i++){const a=i/34*Math.PI*2+Math.random()*.12,len=4.8+Math.random()*4.5,pts=[];for(let j=0;j<=20;j++){const f=j/20,r=.65+len*f,b=.10+Math.random()*.22;pts.push(new THREE.Vector3(Math.cos(a)*r+Math.sin(f*6+a)*b*f,Math.sin(a)*r+Math.cos(f*5-a)*b*f,(f-.5)*.8))}filaments.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xecfff6,transparent:true,opacity:.10+Math.random()*.25,blending:THREE.AdditiveBlending,depthWrite:false})))}
    const shards=new THREE.Group();worldGroup.add(shards);for(let i=0;i<120;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(.035+Math.random()*.15,.018+Math.random()*.12),new THREE.MeshBasicMaterial({color:0xb9e9d2,transparent:true,opacity:.12+Math.random()*.35,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));const a=Math.random()*Math.PI*2,r=7+Math.random()*10;m.position.set(Math.cos(a)*r,Math.sin(a)*r,-3+Math.random()*8);m.rotation.z=Math.random()*Math.PI*2;m.userData={a,r,speed:(Math.random()-.5)*.18,spin:(Math.random()-.5)*.5};shards.add(m)}
    const starGeo=new THREE.BufferGeometry(),sp=[];for(let i=0;i<520;i++){const r=8+Math.random()*18,a=Math.random()*Math.PI*2;sp.push(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-.5)*9)}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));worldGroup.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xc8e9da,size:.028,transparent:true,opacity:.45})));
    const bgScene=new THREE.Scene(),bgCamera=new THREE.Camera(),bgU={uTime:{value:0},uRes:{value:new THREE.Vector2(innerWidth,innerHeight)}};const bgMat=new THREE.ShaderMaterial({uniforms:bgU,vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.);}',fragmentShader:'varying vec2 vUv;uniform float uTime;uniform vec2 uRes;float band(vec2 p,float y,float amp,float freq,float width,float phase){float yy=y+sin(p.x*freq+uTime*.11+phase)*amp+sin(p.x*(freq*1.9)-uTime*.07+phase*2.)*amp*.35;return exp(-abs(p.y-yy)*width);}void main(){vec2 uv=vUv,p=uv-.5;p.x*=uRes.x/uRes.y;float a=0.;a+=band(p,.08,.09,1.7,25.,.3);a+=band(p,.16,.055,2.6,31.,2.1);a+=band(p,.25,.10,1.25,27.,4.);a+=band(p,.35,.06,3.,34.,1.4);a+=band(p,.47,.085,1.5,26.,5.1);a+=band(p,.58,.06,2.3,29.,.7);a+=band(p,.69,.09,1.3,25.,3.1);a*=smoothstep(1.,.12,abs(p.x));float glow=pow(max(0.,1.-length(p*vec2(.72,1.))),3.);vec3 base=vec3(.008,.035,.025),teal=vec3(.08,.42,.32),mint=vec3(.26,.78,.61),col=mix(base,teal,smoothstep(0.,.55,uv.y));col=mix(col,mint,smoothstep(.52,1.,uv.y));col*=a*(.18+.32*glow);float grain=sin(dot(uv*vec2(145.,97.),vec2(12.9898,78.233))+uTime*1.7)*.022;col+=grain*vec3(.35,.65,.5);gl_FragColor=vec4(col,1.);}'});bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMat));
    let t=0,last=performance.now();function frame(now){requestAnimationFrame(frame);if(paused)return;const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;bgU.uTime.value=t;bgU.uRes.value.set(innerWidth,innerHeight);core.rotation.y=t*.18;core.rotation.z=Math.sin(t*.4)*.055;rings.rotation.z=t*.035;filaments.rotation.z=-t*.065;shards.children.forEach(s=>{s.userData.a+=s.userData.speed*dt;s.position.x=Math.cos(s.userData.a)*s.userData.r;s.position.y=Math.sin(s.userData.a)*s.userData.r;s.rotation.z+=s.userData.spin*dt});orb.material.uniforms.uTime.value=t;renderer.render(bgScene,bgCamera);renderer.clearDepth();renderer.render(scene,camera)}requestAnimationFrame(frame);
