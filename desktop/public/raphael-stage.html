<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Raphael Visual Background</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030b08}
  body{pointer-events:none}
  canvas{display:block;width:100%;height:100%}
  #vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 42%,rgba(0,0,0,.20) 100%)}
  #scan{position:fixed;inset:0;pointer-events:none;opacity:.10;background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(255,255,255,.055) 4px,transparent 5px)}
</style>
</head>
<body>
<div id="vignette"></div><div id="scan"></div>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
(()=>{
'use strict';
const W=()=>innerWidth,H=()=>innerHeight;
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(45,W()/H(),.1,100);
camera.position.set(0,0,11);
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));
renderer.setSize(W(),H());
renderer.outputEncoding=THREE.sRGBEncoding;
document.body.appendChild(renderer.domElement);
const bgScene=new THREE.Scene(), bgCamera=new THREE.Camera();
const bgUniforms={uTime:{value:0},uRes:{value:new THREE.Vector2(W(),H())}};
const bgMaterial=new THREE.ShaderMaterial({uniforms:bgUniforms,vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position,1.0);}`,fragmentShader:`
varying vec2 vUv;uniform float uTime;uniform vec2 uRes;
float band(vec2 p,float y,float amp,float freq,float width,float phase){float yy=y+sin(p.x*freq+uTime*.11+phase)*amp+sin(p.x*(freq*1.9)-uTime*.07+phase*2.)*amp*.35;return exp(-abs(p.y-yy)*width);}
void main(){vec2 uv=vUv,p=uv-.5;p.x*=uRes.x/uRes.y;float a=0.;a+=band(p,.08,.09,1.7,25.,.3);a+=band(p,.16,.055,2.6,31.,2.1);a+=band(p,.25,.10,1.25,27.,4.);a+=band(p,.35,.06,3.0,34.,1.4);a+=band(p,.47,.085,1.5,26.,5.1);a+=band(p,.58,.06,2.3,29.,.7);a+=band(p,.69,.09,1.3,25.,3.1);a*=smoothstep(1.0,.12,abs(p.x));float glow=pow(max(0.,1.-length(p*vec2(.72,1.))),3.);vec3 base=vec3(.008,.035,.025);vec3 teal=vec3(.08,.42,.32);vec3 mint=vec3(.26,.78,.61);vec3 col=mix(base,teal,smoothstep(0.,.55,uv.y));col=mix(col,mint,smoothstep(.52,1.,uv.y));col*=a*(.18+.32*glow);float grain=sin(dot(uv*vec2(145.,97.),vec2(12.9898,78.233))+uTime*1.7)*.022;col+=grain*vec3(.35,.65,.5);gl_FragColor=vec4(col,1.);}`});
bgScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),bgMaterial));
const world=new THREE.Group();world.position.y=1.0;world.scale.setScalar(.78);scene.add(world);
function lineLoop(radius,opacity,rotZ=0){const pts=[];for(let i=0;i<=160;i++){const a=i/160*Math.PI*2;pts.push(new THREE.Vector3(Math.cos(a)*radius,Math.sin(a)*radius*.72,0));}const g=new THREE.BufferGeometry().setFromPoints(pts);const m=new THREE.LineBasicMaterial({color:0xdfffee,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false});const l=new THREE.Line(g,m);l.rotation.x=.34;l.rotation.z=rotZ;return l;}
const rings=new THREE.Group();world.add(rings);
for(let i=0;i<9;i++){const r=2.45+i*.30;const ring=lineLoop(r,.15-i*.011,i*.19);rings.add(ring);}
const core=new THREE.Group();world.add(core);
const ico=new THREE.IcosahedronGeometry(2.85,1);
core.add(new THREE.LineSegments(new THREE.EdgesGeometry(ico),new THREE.LineBasicMaterial({color:0xffffff,transparent:true,opacity:.68,blending:THREE.AdditiveBlending})));
const outer=new THREE.IcosahedronGeometry(3.25,0);
core.add(new THREE.LineSegments(new THREE.EdgesGeometry(outer),new THREE.LineBasicMaterial({color:0xbfffe9,transparent:true,opacity:.22,blending:THREE.AdditiveBlending})));
const verts=outer.attributes.position, dots=new THREE.Group(), seen=new Set();
for(let i=0;i<verts.count;i++){const x=verts.getX(i),y=verts.getY(i),z=verts.getZ(i),k=x.toFixed(2)+','+y.toFixed(2)+','+z.toFixed(2);if(seen.has(k))continue;seen.add(k);const d=new THREE.Mesh(new THREE.SphereGeometry(.045,8,8),new THREE.MeshBasicMaterial({color:0xffffff}));d.position.set(x,y,z);dots.add(d);}core.add(dots);
const orb=new THREE.Mesh(new THREE.SphereGeometry(.68,36,36),new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,uniforms:{uTime:{value:0}},vertexShader:`varying vec3 vN;varying vec3 vP;void main(){vN=normalize(normalMatrix*normal);vP=(modelViewMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`uniform float uTime;varying vec3 vN;varying vec3 vP;void main(){float rim=pow(1.-max(dot(normalize(vN),vec3(0.,0.,1.)),0.),2.5);float pulse=.9+.1*sin(uTime*2.);vec3 c=vec3(.82,1.,.91)*(0.38+1.7*rim)*pulse;float a=.06+.94*rim;gl_FragColor=vec4(c*a,a);}` }));core.add(orb);
function glowSprite(size,color,opacity){const c=document.createElement('canvas');c.width=c.height=128;const x=c.getContext('2d'),g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,255,255,1)');g.addColorStop(.18,'rgba(255,255,255,.9)');g.addColorStop(.48,'rgba(210,255,235,.28)');g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(0,0,128,128);return new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),color,transparent:true,opacity,blending:THREE.AdditiveBlending,depthWrite:false}));}
const g1=glowSprite(3.1,0x83ffd2,.16),g2=glowSprite(1.8,0xffffff,.52);core.add(g1,g2);
const filaments=new THREE.Group();world.add(filaments);
for(let i=0;i<34;i++){const a=i/34*Math.PI*2+Math.random()*.12,len=4.8+Math.random()*4.5,pts=[];for(let j=0;j<=20;j++){const f=j/20,r=.65+len*f,b=.10+Math.random()*.22;pts.push(new THREE.Vector3(Math.cos(a)*r+Math.sin(f*6+a)*b*f,Math.sin(a)*r+Math.cos(f*5-a)*b*f,(f-.5)*.8));}filaments.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xecfff6,transparent:true,opacity:.10+Math.random()*.25,blending:THREE.AdditiveBlending,depthWrite:false})));}
const shards=new THREE.Group();world.add(shards);
for(let i=0;i<120;i++){const m=new THREE.Mesh(new THREE.PlaneGeometry(.035+Math.random()*.15,.018+Math.random()*.12),new THREE.MeshBasicMaterial({color:0xb9e9d2,transparent:true,opacity:.12+Math.random()*.35,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false}));const a=Math.random()*Math.PI*2,r=7+Math.random()*10;m.position.set(Math.cos(a)*r,Math.sin(a)*r,-3+Math.random()*8);m.rotation.z=Math.random()*Math.PI*2;m.userData={a,r,speed:(Math.random()-.5)*.18,spin:(Math.random()-.5)*.5};shards.add(m);}
const starGeo=new THREE.BufferGeometry(),sp=[];for(let i=0;i<520;i++){const r=8+Math.random()*18,a=Math.random()*Math.PI*2;sp.push(Math.cos(a)*r,Math.sin(a)*r,(Math.random()-.5)*9);}starGeo.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));world.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xc8e9da,size:.028,transparent:true,opacity:.45})));
let t=0,last=performance.now();
function animate(now){requestAnimationFrame(animate);const dt=Math.min(.05,(now-last)/1000);last=now;t+=dt;bgUniforms.uTime.value=t;bgUniforms.uRes.value.set(W(),H());core.rotation.y=t*.18;core.rotation.z=Math.sin(t*.4)*.055;rings.rotation.z=t*.035;filaments.rotation.z=-t*.065;shards.children.forEach(s=>{s.userData.a+=s.userData.speed*dt;s.position.x=Math.cos(s.userData.a)*s.userData.r;s.position.y=Math.sin(s.userData.a)*s.userData.r;s.rotation.z+=s.userData.spin*dt;});orb.material.uniforms.uTime.value=t;renderer.render(bgScene,bgCamera);renderer.render(scene,camera);}
requestAnimationFrame(animate);
function resize(){camera.aspect=W()/H();camera.updateProjectionMatrix();renderer.setSize(W(),H());renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));bgUniforms.uRes.value.set(W(),H());}
addEventListener('resize',resize);
})();
</script>
</body>
</html>
