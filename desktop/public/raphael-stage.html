<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Great Sage HUD Prototype</title>
<style>
  html, body { margin: 0; padding: 0; background: #030b08; overflow: hidden; height: 100%; }
  #canvas-wrap {
    position: fixed; inset: 0;
    transition: filter 380ms ease, transform 380ms ease;
  }
  /* Idle "blink" only blurs the 3D visual/background (this element),
     not body - unlike the core-click/panel-open lens-focus, which is
     deliberately page-wide to mask a UI transition under the blur. */
  #canvas-wrap.idle-blur {
    filter: blur(8px);
    transform: scale(1.045);
  }
  #canvas-wrap canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body class="startup-snap startup-active startup-intro">
<div id="canvas-wrap"></div>
<div id="win-drag" title="Drag to move"></div>
<div id="win-controls"><button id="win-min" title="Minimise">−</button><button id="win-max" title="Maximise">□</button><button id="win-close" title="Close">×</button></div>
<div id="mini-drag-handle" class="mini-keep" title="Drag to move"></div>
<div id="mini-exit" class="mini-keep" title="Back to full size">×</div>
<div id="mini-chat" class="mini-keep"><span id="mini-chat-text"></span></div>
<div id="core-pole"></div>
<div id="caption-box"><button class="caption-close-btn" title="Dismiss">✕</button><div id="caption-text"></div></div>
<div id="cinematic-caption"><button class="caption-close-btn" title="Dismiss">✕</button><div id="cinematic-caption-text"></div></div>
<div id="bar-caption"><div id="bar-caption-frame"><button class="caption-close-btn" title="Dismiss">✕</button><div id="bar-caption-text"></div></div></div>
<div id="meter">AMPLITUDE: <span id="meter-val">0.00</span></div>
<!-- Full Great Sage prototype source is intentionally kept as the visual source of truth. -->
</body>
</html>
