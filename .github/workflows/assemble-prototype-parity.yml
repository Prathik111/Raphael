name: Assemble prototype parity stage

on:
  push:
    branches:
      - integration/prototype-parity

permissions:
  contents: write

jobs:
  assemble:
    if: contains(github.event.head_commit.message, '[parity-stage-assemble]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Assemble stage
        shell: bash
        run: |
          cat desktop/.parity-stage/stage.part00 \
              desktop/.parity-stage/stage.part01 \
              desktop/.parity-stage/stage.part02 \
            > desktop/public/raphael-stage.html
          test "$(wc -c < desktop/public/raphael-stage.html)" -eq 22240
          printf '%s  %s\n' '0c36f0e1e1d0c25e17460a9058cc17ffc32c082c225c0e90d951b86782f6c39a' desktop/public/raphael-stage.html | sha256sum -c -
          grep -q "renderer.clearDepth()" desktop/public/raphael-stage.html
          grep -q "Backend credential unavailable" desktop/public/raphael-stage.html
          grep -q "center-panel-overlay" desktop/public/raphael-stage.html

      - name: Build frontend
        working-directory: desktop
        run: |
          npm ci
          npm run build

      - name: Commit assembled stage
        shell: bash
        run: |
          rm -rf desktop/.parity-stage
          rm .github/workflows/assemble-prototype-parity.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/public/raphael-stage.html desktop/src/App.tsx desktop/src/raphael.css
          git add -u desktop/.parity-stage .github/workflows/assemble-prototype-parity.yml
          git commit -m "feat(desktop): restore prototype-parity HUD and auth bridge"
          git push origin HEAD:${GITHUB_REF_NAME}
