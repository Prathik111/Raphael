name: Ruff Unsafe Maintenance
on:
  push:
    branches:
      - fix/hardened-security-v2
permissions:
  contents: write
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install "ruff==0.6.9"
      - name: Apply Ruff fixes
        run: python -m ruff check . --fix --unsafe-fixes --exit-zero
      - name: Commit fixes
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: apply Ruff unsafe fixes"
          git push
