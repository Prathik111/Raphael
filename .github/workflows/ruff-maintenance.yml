name: Ruff Maintenance
on:
  push:
    branches:
      - fix/hardened-security-v2
permissions:
  contents: write
jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: format .
      - uses: astral-sh/ruff-action@v3
        with:
          args: check --fix --exit-zero .
      - name: Commit Ruff fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No Ruff changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: fix Ruff lint errors"
          git push
