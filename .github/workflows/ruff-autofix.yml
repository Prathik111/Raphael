name: Ruff Autofix

on:
  push:
    branches: [main, "fix/**"]

permissions:
  contents: write

jobs:
  autofix:
    if: github.event.head_commit.message != 'chore: autofix ruff lint'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Autofix
        run: python -m ruff check src tests --fix --unsafe-fixes
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No Ruff changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "chore: autofix ruff lint"
          git push
